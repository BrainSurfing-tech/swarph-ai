<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Asymmetric Reciprocal Rank fusion flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0f1218"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b93a7"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="28" y="36" fill="#e0e0e0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600">Asymmetric Reciprocal Rank (ARR) Fusion</text>
  <text x="28" y="54" fill="#8b93a7" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">Query → ranked tools → merged results across heterogeneous cells</text>
  <rect x="40" y="120" width="140" height="70" rx="10" fill="#14141e" stroke="#5b8cff" stroke-width="1.5"/>
  <text x="110" y="150" text-anchor="middle" fill="#e0e0e0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600">1. Query</text>
  <text x="110" y="170" text-anchor="middle" fill="#8b93a7" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">intent + constraints</text>
  <line x1="180" y1="155" x2="220" y2="155" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="230" y="90" width="160" height="130" rx="10" fill="#14141e" stroke="#3d4460" stroke-width="1.2"/>
  <text x="310" y="115" text-anchor="middle" fill="#e0e0e0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600">2. Candidates</text>
  <rect x="248" y="128" width="124" height="22" rx="4" fill="#1a2230" stroke="#2dd4bf" stroke-width="1"/>
  <text x="310" y="143" text-anchor="middle" fill="#c5cad6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">tool_a · codegraph</text>
  <rect x="248" y="156" width="124" height="22" rx="4" fill="#1a2230" stroke="#5b8cff" stroke-width="1"/>
  <text x="310" y="171" text-anchor="middle" fill="#c5cad6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">tool_b · narrative</text>
  <rect x="248" y="184" width="124" height="22" rx="4" fill="#1a2230" stroke="#9b5cff" stroke-width="1"/>
  <text x="310" y="199" text-anchor="middle" fill="#c5cad6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">tool_c · board</text>
  <line x1="390" y1="155" x2="430" y2="155" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="440" y="100" width="150" height="110" rx="10" fill="#14141e" stroke="url(#flow)" stroke-width="1.5"/>
  <text x="515" y="130" text-anchor="middle" fill="#e0e0e0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600">3. ARR Rank</text>
  <text x="515" y="152" text-anchor="middle" fill="#8b93a7" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">score(i) ∝ 1/(k+rank)</text>
  <text x="515" y="172" text-anchor="middle" fill="#8b93a7" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">asymmetric weights</text>
  <text x="515" y="192" text-anchor="middle" fill="#2dd4bf" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">per-cell trust prior</text>
  <line x1="590" y1="155" x2="630" y2="155" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="640" y="120" width="120" height="70" rx="10" fill="#14141e" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="700" y="150" text-anchor="middle" fill="#e0e0e0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600">4. Fuse</text>
  <text x="700" y="170" text-anchor="middle" fill="#8b93a7" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">merged result set</text>
  <rect x="80" y="280" width="640" height="170" rx="10" fill="#12121a" stroke="#2a2a38"/>
  <text x="100" y="310" fill="#e0e0e0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600">Example fusion table (schematic)</text>
  <text x="120" y="340" fill="#6b7280" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">TOOL</text>
  <text x="280" y="340" fill="#6b7280" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">CELL RANK</text>
  <text x="420" y="340" fill="#6b7280" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">ARR SCORE</text>
  <text x="560" y="340" fill="#6b7280" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">FUSED ORDER</text>
  <line x1="100" y1="350" x2="700" y2="350" stroke="#2a2a38"/>
  <text x="120" y="375" fill="#c5cad6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">codegraph.search</text>
  <text x="280" y="375" fill="#c5cad6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">1 · 2 · 4</text>
  <text x="420" y="375" fill="#5b8cff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">0.92</text>
  <text x="560" y="375" fill="#2dd4bf" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">#1</text>
  <text x="120" y="400" fill="#c5cad6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">narrative.assess</text>
  <text x="280" y="400" fill="#c5cad6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">2 · 1 · 3</text>
  <text x="420" y="400" fill="#5b8cff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">0.81</text>
  <text x="560" y="400" fill="#2dd4bf" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">#2</text>
  <text x="120" y="425" fill="#c5cad6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">board.link</text>
  <text x="280" y="425" fill="#c5cad6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">5 · 3 · 1</text>
  <text x="420" y="425" fill="#5b8cff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">0.64</text>
  <text x="560" y="425" fill="#2dd4bf" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">#3</text>
  <rect x="620" y="365" width="70" height="8" rx="2" fill="#1a2230"/>
  <rect x="620" y="365" width="64" height="8" rx="2" fill="#5b8cff"/>
  <rect x="620" y="390" width="70" height="8" rx="2" fill="#1a2230"/>
  <rect x="620" y="390" width="56" height="8" rx="2" fill="#5b8cff"/>
  <rect x="620" y="415" width="70" height="8" rx="2" fill="#1a2230"/>
  <rect x="620" y="415" width="44" height="8" rx="2" fill="#5b8cff"/>
</svg>
