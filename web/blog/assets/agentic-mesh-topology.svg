  <line x1="582" y1="165" x2="445" y2="220" stroke="#5b8cff" stroke-width="1.4" marker-end="url(#arr)" opacity="0.85"/>
  <line x1="198" y1="330" x2="355" y2="280" stroke="#5b8cff" stroke-width="1.4" marker-end="url(#arr)" opacity="0.85"/>
  <line x1="602" y1="330" x2="445" y2="280" stroke="#5b8cff" stroke-width="1.4" marker-end="url(#arr)" opacity="0.85"/>
  <line x1="400" y1="380" x2="400" y2="310" stroke="#5b8cff" stroke-width="1.4" marker-end="url(#arr)" opacity="0.85"/>
  <line x1="220" y1="150" x2="580" y2="150" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrg)" opacity="0.7"/>
