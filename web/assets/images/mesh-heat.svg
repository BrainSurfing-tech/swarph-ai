<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <radialGradient id="heat_red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat_amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat_green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="380" fill="#0a0e1a" rx="12"/>
  <text x="300" y="38" fill="#f9fafb" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Spatial Surface &amp; Density Field (2D Gaussian Heatmap)</text>

  <!-- Field Grid -->
  <g stroke="rgba(0, 242, 254, 0.15)" stroke-width="1">
    <line x1="50" y1="70" x2="550" y2="70"/>
    <line x1="50" y1="130" x2="550" y2="130"/>
    <line x1="50" y1="190" x2="550" y2="190"/>
    <line x1="50" y1="250" x2="550" y2="250"/>
    <line x1="50" y1="310" x2="550" y2="310"/>

    <line x1="50" y1="70" x2="50" y2="310"/>
    <line x1="150" y1="70" x2="150" y2="310"/>
    <line x1="250" y1="70" x2="250" y2="310"/>
    <line x1="350" y1="70" x2="350" y2="310"/>
    <line x1="450" y1="70" x2="450" y2="310"/>
    <line x1="550" y1="70" x2="550" y2="310"/>
  </g>

  <!-- Heat Blobs -->
  <circle cx="180" cy="160" r="110" fill="url(#heat_red)"/>
  <circle cx="360" cy="220" r="130" fill="url(#heat_green)"/>
  <circle cx="450" cy="130" r="90" fill="url(#heat_amber)"/>

  <!-- Legend -->
  <g transform="translate(150, 335)">
    <rect x="0" y="0" width="16" height="16" fill="#ef4444" rx="3"/>
    <text x="24" y="13" fill="#9ca3af" font-family="sans-serif" font-size="11">High Congestion</text>

    <rect x="120" y="0" width="16" height="16" fill="#f59e0b" rx="3"/>
    <text x="144" y="13" fill="#9ca3af" font-family="sans-serif" font-size="11">Moderate Control</text>

    <rect x="250" y="0" width="16" height="16" fill="#10b981" rx="3"/>
    <text x="274" y="13" fill="#9ca3af" font-family="sans-serif" font-size="11">Optimal Separation</text>
  </g>
</svg>