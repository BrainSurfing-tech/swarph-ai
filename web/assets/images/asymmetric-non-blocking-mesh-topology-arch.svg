<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00e676"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#0a0e1a" rx="12"/>
  <text x="300" y="38" fill="#f9fafb" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Topology Flow: Asymmetric Non Blocking Mesh Topology</text>

  <!-- Node Alpha -->
  <rect x="40" y="75" width="160" height="55" rx="8" fill="#111827" stroke="#00f2fe" stroke-width="2"/>
  <text x="120" y="108" fill="#f9fafb" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">Ingestion Node A</text>

  <!-- Node Beta -->
  <rect x="400" y="75" width="160" height="55" rx="8" fill="#111827" stroke="#00f2fe" stroke-width="2"/>
  <text x="480" y="108" fill="#f9fafb" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">Telemetry Node B</text>

  <!-- Connecting Lines to Center -->
  <path d="M 120 130 L 230 180" stroke="#00e676" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 480 130 L 370 180" stroke="#00e676" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Center Gateway Core -->
  <rect x="180" y="180" width="240" height="75" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="300" y="215" fill="#fbbf24" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold">ASYMMETRIC CORE ENGINE</text>
  <text x="300" y="238" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="middle">Non-Blocking Hodge Laplacian Flow</text>

  <!-- Output Path -->
  <path d="M 300 255 L 300 295" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output Storage / Web Node -->
  <rect x="150" y="295" width="300" height="55" rx="8" fill="#111827" stroke="#00e676" stroke-width="2"/>
  <text x="300" y="328" fill="#00e676" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">Production Web &amp; Edge Infrastructure</text>
</svg>