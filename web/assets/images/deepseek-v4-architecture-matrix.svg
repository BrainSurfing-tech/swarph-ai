<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <rect width="600" height="380" fill="#0a0e1a" rx="12"/>
  <text x="300" y="38" fill="#f9fafb" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Accuracy vs Latency Matrix Comparison</text>

  <!-- Quadrant Axes -->
  <line x1="300" y1="70" x2="300" y2="310" stroke="#00f2fe" stroke-width="1.5"/>
  <line x1="60" y1="190" x2="540" y2="190" stroke="#00f2fe" stroke-width="1.5"/>

  <!-- Axis Labels -->
  <text x="540" y="180" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="end">Speed →</text>
  <text x="310" y="80" fill="#9ca3af" font-family="sans-serif" font-size="11">Accuracy ↑</text>

  <!-- Competing Dots -->
  <!-- Legacy REST -->
  <circle cx="120" cy="270" r="12" fill="#ef4444"/>
  <text x="120" y="295" fill="#fca5a5" font-family="sans-serif" font-size="11" text-anchor="middle">Centralized REST</text>

  <!-- Redis Queue -->
  <circle cx="240" cy="210" r="14" fill="#f59e0b"/>
  <text x="240" y="235" fill="#fcd34d" font-family="sans-serif" font-size="11" text-anchor="middle">Redis Queue</text>

  <!-- Swarph Peer Mesh (Target Winner) -->
  <circle cx="460" cy="110" r="18" fill="#00e676"/>
  <text x="460" y="85" fill="#00e676" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Our Model (Leader)</text>
</svg>