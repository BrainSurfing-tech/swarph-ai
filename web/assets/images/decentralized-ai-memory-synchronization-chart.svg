<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" height="100%">
  <rect width="520" height="300" fill="#0b0f19" rx="12"/>
  <text x="260" y="35" fill="#f8fafc" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">P99 Peer Dispatch Latency Benchmark (ms)</text>

  <!-- Y-Axis Grid -->
  <line x1="70" y1="230" x2="470" y2="230" stroke="#1e293b" stroke-width="1"/>
  <line x1="70" y1="170" x2="470" y2="170" stroke="#1e293b" stroke-width="1"/>
  <line x1="70" y1="110" x2="470" y2="110" stroke="#1e293b" stroke-width="1"/>
  <line x1="70" y1="50" x2="470" y2="50" stroke="#1e293b" stroke-width="1"/>

  <!-- Bar 1 -->
  <rect x="100" y="60" width="80" height="170" fill="#ef4444" rx="4"/>
  <text x="140" y="50" fill="#fca5a5" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">450 ms</text>
  <text x="140" y="250" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Centralized REST</text>

  <!-- Bar 2 -->
  <rect x="220" y="185" width="80" height="45" fill="#f59e0b" rx="4"/>
  <text x="260" y="175" fill="#fcd34d" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">120 ms</text>
  <text x="260" y="250" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Redis Queue</text>

  <!-- Bar 3 -->
  <rect x="340" y="222" width="80" height="8" fill="#10b981" rx="4"/>
  <text x="380" y="212" fill="#6ee7b7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">14 ms (32x Faster)</text>
  <text x="380" y="250" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Swarph Mesh</text>
</svg>