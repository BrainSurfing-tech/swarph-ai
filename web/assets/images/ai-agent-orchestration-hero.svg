<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="hero_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur_glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Dark Canvas Base -->
  <rect width="800" height="420" fill="url(#hero_bg)" rx="16"/>

  <!-- Glowing Orbs -->
  <circle cx="160" cy="120" r="220" fill="url(#orb1)"/>
  <circle cx="640" cy="300" r="240" fill="url(#orb2)"/>

  <!-- Geometric Grid Background -->
  <pattern id="grid_pattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="420" fill="url(#grid_pattern)" rx="16"/>

  <!-- Glassmorphic Banner Overlay -->
  <rect x="50" y="50" width="700" height="320" rx="16" fill="#111827" fill-opacity="0.6" stroke="#00f2fe" stroke-width="2"/>

  <!-- Header Badge -->
  <rect x="80" y="80" width="220" height="32" rx="16" fill="#00f2fe" fill-opacity="0.2" stroke="#00f2fe" stroke-width="1"/>
  <text x="190" y="101" fill="#00e676" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">TECHNICAL WHITEPAPER</text>

  <!-- Title -->
  <text x="80" y="165" fill="#f9fafb" font-family="sans-serif" font-size="24" font-weight="bold">Ai Agent Orchestration</text>
  <text x="80" y="198" fill="#f9fafb" font-family="sans-serif" font-size="20" font-weight="bold"></text>

  <!-- Metric Badges -->
  <g transform="translate(80, 240)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="180" height="80" rx="10" fill="#0a0e1a" fill-opacity="0.8" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="20" y="32" fill="#9ca3af" font-family="sans-serif" font-size="12">LATENCY / SPEED</text>
    <text x="20" y="62" fill="#00e676" font-family="sans-serif" font-size="20" font-weight="bold">&lt; 14 ms (P99)</text>

    <!-- Metric 2 -->
    <rect x="200" y="0" width="180" height="80" rx="10" fill="#0a0e1a" fill-opacity="0.8" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="220" y="32" fill="#9ca3af" font-family="sans-serif" font-size="12">ACCURACY / CORR</text>
    <text x="220" y="62" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold">R² = 0.88</text>

    <!-- Metric 3 -->
    <rect x="400" y="0" width="220" height="80" rx="10" fill="#0a0e1a" fill-opacity="0.8" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="420" y="32" fill="#9ca3af" font-family="sans-serif" font-size="12">ARCHITECTURE</text>
    <text x="420" y="62" fill="#f9fafb" font-family="sans-serif" font-size="18" font-weight="bold">Peer-to-Peer Mesh</text>
  </g>
</svg>